# The efai-base bundle patch: every row this fork adds to a base-backed
# profile, applied as ONE insert over upstream's `dsh-base` layer.
#
# This file exists so the fork touches no upstream composition. It is stacked
# after `@deepseek-ai/dsh-base` by the profile's bundle list, which the fork's
# launcher keeps current (`start.cmd`, `start.sh`, `install.ps1`, `install.sh`);
# a profile without it runs upstream's harness unchanged, which is exactly what
# a profile without it should do.
#
# No row here carries a `!!js` settings expression. A Loader expression is read
# once at boot, so gating composition on a setting makes that setting a restart
# by construction. The fork's switches are live config fields of the rows that
# enforce them instead, edited from Settings by row id:
#
#   tool-roster: kernel / enabled / tools — filters the assembled prompt
#                                   and guards execution, per turn.
#   agent-memory: enabled         — mounts and unmounts the engine itself,
#                                   because the engine writes to disk and hiding
#                                   a tool would not stop it.
#   kernel-python: browserWindow  — read when the kernel process starts.
#
# Row order carries no load semantics (activation is service-availability
# driven).

- insert:
    # The identity opener: the first line the model reads, replacing the
    # harness's shipped one. A plugin rather than an edit to the prompt
    # package, because the opener has to hold however that package is
    # configured — including a later patch layer restating its config.
    - id: efai-identity
      name: '@deepseek-ai/dsh-efai-identity'

    # Text-channel tool calls, read on EVERY route.
    #
    # Which tool-call markup a model writes comes from the model, not from the
    # transport: a request that filled a provider's native `tools` field can
    # still get the call back as text — `<tool_calls>`, `<function_calls>`, or
    # DeepSeek's pipe-wrapped `<｜｜DSML｜｜ …>` special tokens. Unread, that call
    # reaches the user as markup and reads back to the model as an action that
    # returned nothing.
    #
    # The pass is silent: it converts what it can parse into a real tool call
    # and forwards everything else exactly as the adapter emitted it. Only an
    # adapter with no native tool channel (llm-kiln) TEACHES this format, and
    # only that adapter corrects the model about it.
    - id: llm-text-toolcalls
      name: '@deepseek-ai/dsh-llm-text-toolcalls'
      config:
        reasoningRecovery: true
        excludeProviders: []

    # Markdown fidelity for the answer itself, on every route: a table whose
    # delimiter row arrived glued to its header (`| a | b |---|---|`) has written
    # a paragraph of pipes, and no renderer can guess the table back. The pass
    # inserts the newline markdown asks for and changes nothing else.
    #
    # It sits inside the text-toolcall reader rather than outside it: that reader
    # rebuilds a block from the deltas below it, so a repair applied to the block
    # alone would be dropped on the routes it manages.
    - id: llm-markdown-fidelity
      name: '@deepseek-ai/dsh-llm-markdown-fidelity'

    # The Kiln provider registry: sixteen presets (Anthropic, OpenAI, Gemini,
    # OpenRouter, the DeepSeek paid API, Groq, xAI, Mistral, Together,
    # Fireworks, Perplexity, Cerebras, NVIDIA, Ollama, LM Studio) plus
    # `ds_direct`, DeepSeek's free web session. Routes are named `kiln-<id>` so
    # they cannot collide with `deepseek-official` or the pi-ai catalog names.
    #
    # Keys are never configuration: each preset names the environment variable
    # holding its key, resolved per request by the Python sidecar. A route with
    # no key stays visible and selectable, and fails per request with the
    # registry's own message naming the variable to set.
    # The account-pool registry: which routes accept a login, and the Remote
    # surface a settings page uses to add, inspect, and repair one. Mounted
    # ahead of the providers that register into it.
    - id: ai-accounts
      name: '@deepseek-ai/dsh-ai-accounts'

    # Deferred sends: the Remote surface the peak-hour send dialog
    # (`ui-peak-hours`) uses to hold a DeepSeek API message until peak pricing
    # ends, as an Automation task. Needs the schedule service.
    - id: peak-send
      name: '@deepseek-ai/dsh-peak-send'

    # The `site` tool: publish pages the agent builds (illustrations, slide
    # decks, explainers, charts) at https://<name>.dshai.reggilion.com through
    # GitHub Pages and deSEC DNS. Reads DESEC_TOKEN and the GitHub CLI login.
    - id: tool-sites
      name: '@deepseek-ai/dsh-tool-sites'

    - id: llm-kiln
      name: '@deepseek-ai/dsh-llm-kiln'
      config:
        routePrefix: kiln-
        onlyConfigured: false

    # The running host's authenticated Web URL, published to an encrypted lock
    # file. The Web host mints one token per boot and prints it once, to stdout,
    # so anything that did not capture that line — a supervisor that restarted
    # the app, a second terminal, an agent that finds the app already running —
    # otherwise cannot open the GUI. `node scripts/web-access.mjs` reads it.
    - id: web-access
      name: '@deepseek-ai/dsh-host-web-access'

    # What a compacted turn gets back. A summary drops exactly what code can
    # know for certain — the operator's own words, the files touched, the
    # commands run, the errors still open, the todo list — so this folds those
    # into a ledger as the log commits and, in the same step a compaction
    # happens, adds one handoff message restating them plus the current
    # contents of the files most recently changed. The turn carries on; nothing
    # is acknowledged and no step is spent. It also registers
    # `{{session_log}}`, `{{session_dir}}`, and `{{session_id}}`, so a
    # deployment persona can name this session's own log file.
    #
    # `root` mirrors upstream's `session-persistence-jsonl` row and must move
    # with it: the two derive the same path, and a mismatch prints a file that
    # does not exist.
    - id: session-recovery-context
      name: '@deepseek-ai/dsh-session-recovery-context'
      config:
        root: !!js dshHomePath('sessions')

    # Old tool output gives way before the context fills. Once half the routed
    # model's window is in use, every successful text result older than the
    # newest eight and longer than 2,000 characters is replaced, in one batch,
    # by a stub naming the call, its size, and its first and last lines; the
    # original stays in the log. Most of a long session's context is output
    # the model has already acted on, so this defers compaction and leaves it
    # a smaller, denser history to summarize. Errors are never masked.
    - id: output-masking
      name: '@deepseek-ai/dsh-output-masking'
      config:
        usageRatio: 0.5
        keepRecent: 8
        minChars: 2000
        minBatch: 4

    # ── the acting surface ──────────────────────────────────────────────────
    #
    # The kernel seam, its Kiln-backed Python process, and the model-facing
    # tool. The process is lazy — nothing spawns until the first cell — but the
    # interpreter is resolved at load, so a machine without Python reports an
    # unavailable provider at selection time rather than mid-cell.
    - id: kernel
      name: '@deepseek-ai/dsh-kernel'
      config:
        defaultTimeoutMs: 180000

    # `browserWindow` is not stated here: the provider reads `kernel.browserWindow`
    # from the settings document when a settings service is mounted, and falls
    # back to its own default otherwise. The value reaches the kernel as a child
    # environment variable read once per process, so a change lands on the next
    # kernel start.
    - id: kernel-python
      name: '@deepseek-ai/dsh-kernel-python'
      config:
        cwd: !!js process.env.DSH_KERNEL_CWD

    # The kernel tool stays on the host plane in every profile. The tools
    # registry is layered, so a host registration reaches every preset agent's
    # catalog, and each call resolves its own agent (`exec.agent`), so one row
    # serves every session. `tool-roster` decides per turn whether the model
    # sees the `kernel` tool at all.
    - id: tool-kernel
      name: '@deepseek-ai/dsh-tool-kernel'
      config:
        timeoutMs: 180000

    # The memory switch AND its mount: the engine observes every tool result and
    # writes evidence to disk, so its off position has to be "not running",
    # which this row's plugin decides live rather than at boot.
    - id: agent-memory
      name: '@deepseek-ai/dsh-agent-memory'
      config:
        enabled: false

    # Lifetime token usage: the same durable samples upstream's token-meter
    # folds, without the per-compaction reset, which is what /session-info
    # reports as the session total.
    - id: token-usage-lifetime
      name: '@deepseek-ai/dsh-token-usage-lifetime'

    # Two ways a skill body reaches the model that upstream does not provide:
    # the `@skill <name>` gesture the client picker lands, and the names whose
    # body re-enters after a compaction prunes it.
    - id: skill-injection
      name: '@deepseek-ai/dsh-skill-injection'
      config:
        alwaysLoadSkills: ['dsh-session-history']

    - id: command-session-info
      name: '@deepseek-ai/dsh-command-session-info'

    # Upstream's editor tool, which upstream's own base bundle does not mount.
    - id: tool-str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

    # The agent's browser pages in the Desktop window's right sidebar. The Host
    # half is the `agentBrowser` service the `browser` tool drives; the browser
    # half, inside the Desktop renderer only, carries each agent page in a
    # webview and shows it in the "AI Browser" sidebar tab, so the operator sees
    # the page the agent is on and can use it. Mounted ahead of `web-browser`,
    # whose sidebar driver resolves this service per call.
    - id: web-browser-sidebar
      name: '@deepseek-ai/dsh-web-browser-sidebar'

    # The `browser` tool and a browser-rendered fetch provider. The tool's page
    # is carried by the Desktop sidebar whenever a Desktop window is connected
    # (`driver: auto`), and by a self-hosted headless Playwright Chromium
    # otherwise; the fetch provider always renders headless, dormant until
    # web_fetch is turned on and its fetchProvider is pointed at `browser`.
    # Headless needs a one-time `npx playwright install chromium`; a launch
    # without the binary fails with that exact instruction rather than a stack
    # trace.
    - id: web-browser
      name: '@deepseek-ai/dsh-web-browser'

    # Tools for changing the harness and seeing the result: `desktop_test_instance`
    # starts a separate test copy of the installed Desktop app on its own profile
    # and drives its window over the DevTools Protocol, so a GUI change is checked
    # in a real window while the operator keeps working in theirs;
    # `build_workspace_package` builds one workspace package without the root build.
    - id: harness-dev-tools
      name: '@deepseek-ai/dsh-harness-dev-tools'

    # Profile sync: providers, plugin enablement, and API key references stay
    # identical across every profile under the harness home. An edit in any
    # profile is written into every other profile's files; running profiles
    # reload it live. Exclude a profile with `config.exclude`.
    - id: profile-sync
      name: '@deepseek-ai/dsh-profile-sync'

    # The runtime roster. It owns the kernel and conventional-tool switches as
    # live config fields, and the turn boundary that holds a change back until
    # the model stops generating.
    - id: tool-roster
      name: '@deepseek-ai/dsh-tool-roster'
