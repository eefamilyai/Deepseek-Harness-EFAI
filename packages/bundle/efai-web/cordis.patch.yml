# The efai-web bundle patch: the fork's rows for the browser profile, applied
# over upstream's `dsh-web-app` layer and the fork's own `dsh-efai-base`.
#
# Stacked by the profile's bundle list, which the fork's launcher keeps current.
# A profile without it runs upstream's Web surface unchanged.

- insert:
    # Interaction polish for the whole client: the shell's motion scale, its
    # elevation tokens, overlay entrances, and control feedback, as one injected
    # stylesheet. Mounted ahead of the rows below because it paints them.
    - id: ui-polish
      name: '@deepseek-ai/dsh-client-ui-polish'

    # The sidebar brand. Upstream's occupant registers only in an `official`
    # client build, so every other build falls through to the shell's
    # "DSH Local Build" label; this row is the fork's own package, which
    # registers the whale mark and the product wordmark unconditionally. The
    # upstream row is switched off below rather than left to lose a race with it.
    - id: ui-brand-efai
      name: '@deepseek-ai/dsh-client-ui-brand-efai'

    # Which commit the running host was started from, at GET /version. Upstream's
    # web-app row carries no such route, and an operator confirming that the page
    # they are looking at is the code they just edited should not have to read the
    # process table.
    - id: version-route
      name: '@deepseek-ai/dsh-host-version-route'

    # The per-family accent palette, as a theme override layer. The row
    # chrome that reads these tokens ships in upstream's own module stylesheets;
    # this row is what declares them.
    - id: ui-flow-accents
      name: '@deepseek-ai/dsh-client-ui-flow-accents'

    # Frame-wide visual effects: the ambient backdrop, the focus lock, and their
    # Settings toggles.
    - id: ui-effects
      name: '@deepseek-ai/dsh-client-ui-effects'

    # The fork's own settings sections (Tools, Personalization, Accounts) are NOT
    # composed. Each restated a subject the upstream sections already own — tool
    # rows are toggled in Built-in plugins, appearance and font size in General,
    # and sign-in in Models — so they only added a second place to set the same
    # thing. Their packages stay installed but unmounted; re-add a row here to
    # bring one back.

    # The account-pool Remote namespace is mounted by `dsh-efai-base`, which
    # this layer stacks over: one row id belongs to one bundle. Declaring it here
    # as well would compose the id twice, and the Plugins page locks any row the
    # Host cannot address through the profile patch — a twice-composed id is
    # exactly that, so the row would run while its own switch refused to move.

    # The DeepSeek pricing pill under the composer: amber while DeepSeek bills
    # peak rates (2× off-peak) and shortly before, quiet off-peak. Weekends and
    # Chinese public holidays count as off-peak, as DeepSeek prices them. During
    # peak, a DeepSeek API message asks first: send anyway, schedule it for when
    # peak ends (through `peak-send` in dsh-efai-base), or keep editing.
    - id: ui-peak-hours
      name: '@deepseek-ai/dsh-client-ui-peak-hours'

    # Provider visibility: a switch on every provider card of the Models
    # settings page, and a list at its end for providers without a card; a
    # provider switched off is left out of the model picker.
    - id: model-visibility
      name: '@deepseek-ai/dsh-client-ui-model-visibility'

    # The `@skill` picker: the session skill catalog as an `@` trigger source
    # beside @file/@session. Upstream registers the same source inside a package
    # the official Desktop also ships, so the fork's registration is what renders
    # there; both register under (trigger '@', name 'skills'), and upstream's own
    # package registers the '/' form only.
    - id: ui-skill-mention
      name: '@deepseek-ai/dsh-client-ui-skill-mention'

# The Profiles tab (`profile-hub`) and the Skills tab (`skills-studio`) are
# switched off; EFAI-REMOVED-PLUGINS.md has their rows and how to restore them.

# Upstream's sidebar brand, replaced rather than restyled: `ui-brand-efai` above
# registers the same two occupants for every build profile.
- id: ui-brand-official
  disabled: true
